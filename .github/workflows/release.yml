name: Native release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, commit, or v-prefixed tag to build
        required: true
        default: main
        type: string
      publish:
        description: Publish GitHub and npm releases (ref must be a version tag)
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}
  RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || (inputs.publish && inputs.ref || '') }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Install and audit locked dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm runtime:sync
          pnpm security:audit

      - name: Match package versions to the tag
        run: |
          pnpm release:verify
          npm pack --dry-run ./packages/cli

  build:
    needs: validate
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            target: win32-x64
          - runner: windows-11-arm
            target: win32-arm64
          - runner: macos-15-intel
            target: darwin-x64
          - runner: macos-15
            target: darwin-arm64
          - runner: ubuntu-24.04
            target: linux-x64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync and audit the portable web runtime
        run: |
          pnpm runtime:sync
          npm audit --omit=dev --audit-level=high --prefix packaging/web-runtime

      - name: Build the web console
        run: pnpm build

      - name: Prepare OpenSSL for Windows ARM64
        if: matrix.target == 'win32-arm64'
        shell: pwsh
        run: |
          $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT
          if (-not $vcpkgRoot) {
            throw "VCPKG_INSTALLATION_ROOT is not available on this runner."
          }

          $vcpkg = Join-Path $vcpkgRoot "vcpkg.exe"
          if (-not (Test-Path -LiteralPath $vcpkg)) {
            throw "vcpkg.exe was not found at $vcpkg."
          }

          & $vcpkg install openssl:arm64-windows-static-md
          if ($LASTEXITCODE -ne 0) {
            throw "vcpkg failed to install OpenSSL for Windows ARM64."
          }

          "VCPKG_ROOT=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build and smoke-test the native API
        run: |
          pnpm backend:bundle
          pnpm backend:bundle:smoke

      - name: Install the Rust toolchain for native launchers
        run: rustup toolchain install stable --profile minimal

      - name: Build the native Windows helper
        if: startsWith(matrix.target, 'win32-')
        run: pnpm native:build

      - name: Build and smoke-test the installed application
        env:
          SOCIUM_RELEASE_TARGET: ${{ matrix.target }}
        run: |
          pnpm release:bundle -- --target ${{ matrix.target }}
          pnpm release:bundle:smoke

      - name: Build and smoke-test the dependency-free installer
        env:
          SOCIUM_RELEASE_TARGET: ${{ matrix.target }}
        run: |
          pnpm native:installer -- --target ${{ matrix.target }}
          pnpm native:installer:smoke -- --target ${{ matrix.target }}

      - name: Upload the native release asset
        uses: actions/upload-artifact@v7
        with:
          name: socium-release-${{ matrix.target }}
          path: |
            release/socium-*-${{ matrix.target }}.tar.gz
            release/socium-*-${{ matrix.target }}.tar.gz.sha256
            release/socium-asset-${{ matrix.target }}.json
            release/socium-installer-${{ matrix.target }}.json
            release/Socium-*
          if-no-files-found: error
          compression-level: 0

  github-release:
    needs: build
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Download native assets
        uses: actions/download-artifact@v7
        with:
          pattern: socium-release-*
          path: release
          merge-multiple: true

      - name: Assemble the checksummed release manifest
        run: pnpm --filter socium manifest release

      - name: Verify the native installer matrix
        run: pnpm native:installer:verify

      - name: Write the simple three-platform release page
        run: pnpm release:notes > release/socium-release-notes.md

      - name: Create or refresh the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/Socium-* release/socium-*.tar.gz release/socium-manifest.json --clobber
            gh release edit "$RELEASE_TAG" --notes-file release/socium-release-notes.md --title "Socium ${RELEASE_TAG#v}"
          else
            gh release create "$RELEASE_TAG" release/Socium-* release/socium-*.tar.gz release/socium-manifest.json --verify-tag --notes-file release/socium-release-notes.md --title "Socium ${RELEASE_TAG#v}"
          fi

  npm-publish:
    needs: github-release
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Install Node.js for npm publishing
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Publish the one-command installer
        working-directory: packages/cli
        run: |
          VERSION="${RELEASE_TAG#v}"
          if npm view "socium@$VERSION" version >/dev/null 2>&1; then
            echo "socium@$VERSION is already published."
          else
            npm publish --access public --provenance
          fi
