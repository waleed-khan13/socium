name: Deploy Socium Connect Broker

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: socium-connect-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: socium-connect-production
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.7.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run broker security tests
        run: pnpm --filter @socium/connect-broker test
      - name: Prepare encrypted Worker secrets
        run: node scripts/write-secret-bulk.mjs
        working-directory: packages/connect-broker
        env:
          HANDOFF_ENCRYPTION_KEY: ${{ secrets.HANDOFF_ENCRYPTION_KEY }}
          SLACK_CLIENT_ID: ${{ secrets.SLACK_CLIENT_ID }}
          SLACK_CLIENT_SECRET: ${{ secrets.SLACK_CLIENT_SECRET }}
          SLACK_SIGNING_SECRET: ${{ secrets.SLACK_SIGNING_SECRET }}
          LINKEDIN_CLIENT_ID: ${{ secrets.LINKEDIN_CLIENT_ID }}
          LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
      - name: Deploy Worker and migrate D1
        run: pnpm --filter @socium/connect-broker deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify production health
        run: curl --fail --silent --show-error "$SOCIUM_CONNECT_URL/health"
        env:
          SOCIUM_CONNECT_URL: ${{ secrets.SOCIUM_CONNECT_URL }}
      - name: Remove temporary secret file
        if: always()
        run: rm -f packages/connect-broker/.production.secrets.json
