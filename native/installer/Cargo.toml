[package]
name = "socium-native-installer"
version = "1.4.0"
edition = "2024"
license = "MIT"
description = "Dependency-free native installer for Socium"
publish = false
build = "build.rs"

[dependencies]
flate2 = "1.1.2"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
sha2 = "0.10.9"
tar = "0.4.44"

[build-dependencies]
winresource = "0.1.23"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = "symbols"
