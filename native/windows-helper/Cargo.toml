[package]
name = "socium-windows-helper"
version = "1.1.0"
edition = "2024"
license = "MIT"
description = "Minimal native Windows integration for Socium"
publish = false

[dependencies]
rfd = "0.15.4"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
tray-icon = "0.24.2"
windows = { version = "0.62.0", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = "symbols"
