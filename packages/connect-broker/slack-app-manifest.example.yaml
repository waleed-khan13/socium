display_information:
  name: Socium
  description: Local-first social publishing approvals
  background_color: "#050505"
features:
  bot_user:
    display_name: Socium
    always_online: false
oauth_config:
  redirect_urls:
    - https://socium-connect.socium-connect-broker.workers.dev/v1/oauth/slack/callback
  scopes:
    bot:
      - chat:write
      - files:write
      - im:write
settings:
  interactivity:
    is_enabled: true
    request_url: https://socium-connect.socium-connect-broker.workers.dev/v1/slack/interactions
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
